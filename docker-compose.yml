services:
  postgres:
    image: postgres:16-alpine
    container_name: lynx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lynx
      POSTGRES_PASSWORD: lynx
      POSTGRES_DB: lynx_terminal
    ports:
      - "5432:5432"
    volumes:
      - lynx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lynx -d lynx_terminal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lynx_pgdata:
